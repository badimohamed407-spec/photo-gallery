<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Interactive Photo Gallery</h1>

  <div id="image" class="preview">
    Hover over an image below to display here.
  </div>

  <div class="gallery">
    <img class="thumb" src="https://picsum.photos/id/1015/400/300" alt="River valley between mountains"
         tabindex="0"
         onmouseover="upDate(this)" onmouseout="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="thumb" src="https://picsum.photos/id/1018/400/300" alt="Green mountains under a cloudy sky"
         tabindex="0"
         onmouseover="upDate(this)" onmouseout="unDo()"
         onfocus="upDate(this)" onblur="unDo()">

    <img class="thumb" src="https://picsum.photos/id/1039/400/300" alt="Waterfall in a forest"
         tabindex="0"
         onmouseover="upDate(this)" onmouseout="unDo()"
         onfocus="upDate(this)" onblur="unDo()">
  </div>

  <script src="script.js"></script>
</body>
</html>
